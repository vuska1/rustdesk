name: Full Flutter CI

on:
  workflow_dispatch:
  pull_request:
    paths-ignore:
    - "docs/**"
    - "README.md"
  push:
    branches:
      - master
    paths-ignore:
      - ".github/**"
      - "docs/**"
      - "README.md"
      - "res/**"
      - "appimage/**"
      - "flatpak/**"

jobs:
  run-ci:
    uses: ./.github/workflows/flutter-build.yml
    with:
      # claude: true – Binaries (exe, dmg, AppImage, deb) werden als Artifacts hochgeladen
      upload-artifact: true
    # claude: Secrets müssen explizit weitergegeben werden bei reusable workflows
    secrets: inherit
